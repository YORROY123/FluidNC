[env:oled]
extends = env:wifi
build_src_filter = ${env:wifi.build_src_filter} +<src/OLED.cpp>

; extra_scripts REPLACES the value inherited via "extends" rather than adding to
; it, so these must repeat ${common_esp32.extra_scripts} explicitly.  Leaving it
; out silently drops FluidNC/ld/esp32/vtable_in_dram.py, which is what puts the
; PinDetail and Spindle vtables in DRAM.  Without it they land in flash, and the
; step ISR reads them - which panics the board whenever the flash cache happens
; to be disabled.

[env:wifi]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

[env:noradio]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

[env:bt]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

; ---------------------------------------------------------------------------
; wifi_eth - plain ESP32 (ESPduino + CNC shield v3) with W5500 Ethernet
;
; Upstream builds plain ESP32 against platformio/platform-espressif32, which
; still pins framework-arduinoespressif32 2.0.17 (Arduino core 2.0.17 /
; ESP-IDF 4.4).  Machine/EthPhy.cpp needs the SPI-attached-Ethernet
; ETH.begin() overload, which only exists in Arduino core 3.x / ESP-IDF 5.x,
; and MAX_N_ETH in FluidNC/esp32/esp32/Platform.h is gated on that.  So this
; env is exactly [env:wifi] with the platform swapped for the same pioarduino
; build that common_esp32s3 already uses, keeping board = esp32dev.
;
; Not added to default_envs on purpose - build it explicitly:
;     pio run -e wifi_eth
;
; Note: extra_scripts is REPLACED rather than merged by "extends", so
; ${common_esp32.extra_scripts} has to be repeated here (see the comment on
; [env:wifi] above).  vtable_in_dram.py prepends FluidNC/ld/esp32/$PIOENV to
; LIBPATH, so this env needs its own FluidNC/ld/esp32/wifi_eth/sections.ld
; taken from the core 3.x framework package - the checked-in wifi/bt/noradio
; copies are core 2.0.17 / IDF 4.4 files and are not interchangeable.
; ---------------------------------------------------------------------------
[env:wifi_eth]
extends = common_esp32
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
; pioarduino ships its own core 3.x framework package; the 2.0.17 pin
; inherited from common_esp32 has to be cleared, not merely overridden.
platform_packages =
; min_littlefs.csv gives each of two OTA slots 0x1E0000 (1.875MB); this build is
; ~2.5MB.  Two slots that size do not fit on 4MB flash, so OTA is dropped rather
; than merely reconfigured - see the header of the csv.
board_build.partitions = FluidNC/ld/esp32/noota_2M8_littlefs.csv
lib_deps =
    ${common.lib_deps}
    ${common_esp32_base.lib_deps}
    ${common.wifi_deps}
build_src_filter =
    ${common_esp32.build_src_filter}
    ${common_wifi.build_src_filter}
    +<../esp32/ESPNow>
    ; fatfs_tiny is core-2.0.17-only by construction: ff_tiny.c/vfs_fat_tiny.c
    ; #include verbatim copies of ESP-IDF v4.4.7 ff.c/vfs_fat.c, chosen to be
    ; ABI-identical to the members of that framework's frozen libfatfs.a (see
    ; FluidNC/esp32/esp32/fatfs_tiny/README.md).  Against IDF 5.x they neither
    ; compile nor match the archive they are meant to override.
    -<../esp32/esp32/fatfs_tiny/ff_tiny.c>
    -<../esp32/esp32/fatfs_tiny/vfs_fat_tiny.c>
    ; FluidNC/stdfs is written against the libstdc++ that ships with the IDF 4.4
    ; toolchain (gcc 8.4) and reaches into its internals - filesystem_error::
    ; _M_gen_what(), recursive_directory_iterator::_M_options/_M_pending,
    ; system_clock-based file times.  All of those changed by gcc 14.2, so it
    ; does not compile here.  Use stdfs17 instead, exactly as common_esp32s3
    ; does; see the -Wl,-z,muldefs note in [common_esp32s3] build_flags.
    -<../stdfs>
    +<../stdfs17/*.cpp>
    +<../stdfs17/src/c++17/*.cc>
build_flags =
    ${common_esp32.build_flags}
    ; [common_wifi] build_flags spelled out rather than interpolated, because
    ; VARIANT has to differ.  It is a pure label: Report.cpp is the only consumer
    ; and prints it as MCU "-" VARIANT in the startup banner and [VER:...] line.
    -DENABLE_WS_CHANNEL_PINS
    -DVARIANT=\"itrinc\"
    -DDISABLE_ARDUINO_OTA
    -IFluidNC/stdfs17
    -IFluidNC/stdfs17/include
    -Wl,-z,muldefs
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py
