board: Wemos_CNCshield
name: itrinc
meta: 4axis_OLED_21_22
stepping: 
  engine: RMT
  idle_ms: 250
  pulse_us: 2
  dir_delay_us: 1
  disable_delay_us: 0
  segments: 12

i2c0: 
  sda_pin: gpio.21
  scl_pin: gpio.22
  frequency: 100000

spi: 
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18

ethernet:
  cs_pin: gpio.5
  int_pin: NO_PIN
  rst_pin: NO_PIN
  phy_type: w5500
  phy_addr: 1
  frequency_hz: 1000000


kinematics: 
  Cartesian: 

axes: 
  shared_stepper_disable_pin: NO_PIN
  shared_stepper_reset_pin: NO_PIN
  x: 
    steps_per_mm: 400.000000
    max_rate_mm_per_min: 2000.000000
    acceleration_mm_per_sec2: 400.000000
    max_travel_mm: 150.000000
    soft_limits: false
    homing: 
      cycle: 2
      allow_single_axis: true
      positive_direction: true
      mpos_mm: -3.000000
      feed_mm_per_min: 800.000000
      seek_mm_per_min: 1200.000000
      settle_ms: 200
      seek_scaler: 1.500000
      feed_scaler: 1.500000

    motor0: 
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: gpio.36:low
      hard_limits: false
      pulloff_mm: 3.000000
      stepstick: 
        step_pin: gpio.26
        direction_pin: gpio.16
        disable_pin: NO_PIN
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
        reset_pin: NO_PIN

  y: 
    steps_per_mm: 400.000000
    max_rate_mm_per_min: 2000.000000
    acceleration_mm_per_sec2: 400.000000
    max_travel_mm: 150.000000
    soft_limits: false
    homing: 
      cycle: 2
      allow_single_axis: true
      positive_direction: false
      mpos_mm: 3.000000
      feed_mm_per_min: 800.000000
      seek_mm_per_min: 1200.000000
      settle_ms: 200
      seek_scaler: 1.500000
      feed_scaler: 1.500000

    motor0: 
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: gpio.34:low
      hard_limits: false
      pulloff_mm: 3.000000
      stepstick: 
        step_pin: gpio.25
        direction_pin: gpio.27
        disable_pin: NO_PIN
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
        reset_pin: NO_PIN

  z: 
    steps_per_mm: 400.000000
    max_rate_mm_per_min: 2000.000000
    acceleration_mm_per_sec2: 400.000000
    max_travel_mm: 200.000000
    soft_limits: false
    homing: 
      cycle: 1
      allow_single_axis: true
      positive_direction: true
      mpos_mm: -3.000000
      feed_mm_per_min: 800.000000
      seek_mm_per_min: 1200.000000
      settle_ms: 200
      seek_scaler: 1.200000
      feed_scaler: 1.200000

    motor0: 
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: gpio.35:low
      hard_limits: false
      pulloff_mm: 3.000000
      stepstick: 
        step_pin: gpio.17
        direction_pin: gpio.14
        disable_pin: NO_PIN
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
        reset_pin: NO_PIN

  a: 
    steps_per_mm: 106.6667
    max_rate_mm_per_min: 4000.000000
    acceleration_mm_per_sec2: 1000.000000
    max_travel_mm: 400.000000
    soft_limits: false
    homing: 
      cycle: 3
      allow_single_axis: true
      positive_direction: true
      mpos_mm: 0.000000
      feed_mm_per_min: 5000.000000
      seek_mm_per_min: 5000.000000
      settle_ms: 250
      seek_scaler: 1.100000
      feed_scaler: 1.100000

    motor0: 
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: gpio.39:low
      hard_limits: false
      pulloff_mm: 3.000000
      stepstick: 
        step_pin: gpio.33
        direction_pin: gpio.32
        disable_pin: NO_PIN
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
        reset_pin: NO_PIN

control: 
  safety_door_pin: NO_PIN
  reset_pin: NO_PIN
  feed_hold_pin: NO_PIN
  cycle_start_pin: NO_PIN
  macro0_pin: NO_PIN
  macro1_pin: gpio.0:low:pu
  macro2_pin: gpio.15:low:pu
  macro3_pin: NO_PIN
  fault_pin: NO_PIN
  estop_pin: NO_PIN

coolant: 
  flood_pin: NO_PIN
  mist_pin: NO_PIN
  delay_ms: 0

probe: 
  pin: gpio.13:low:pu
  toolsetter_pin: NO_PIN
  check_mode_start: true

macros: 
  startup_line0: 
  startup_line1: 
  macro0: 
  macro1: $LocalFS/Run=REST.txt
  macro2: $SD/Run=upper_V2.txt
  macro3: 
  after_homing: 
  after_reset: 
  after_unlock: 

start: 
  must_home: false
  deactivate_parking: false
  check_limits: true

parking: 
  enable: false
  axis: Z
  target_mpos_mm: -5.000000
  rate_mm_per_min: 800.000000
  pullout_distance_mm: 5.000000
  pullout_rate_mm_per_min: 250.000000

user_outputs: 
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  analog0_hz: 5000
  analog1_hz: 5000
  analog2_hz: 5000
  analog3_hz: 5000
  digital0_pin: gpio.12
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN

oled: 
  report_interval_ms: 500
  i2c_num: 0
  i2c_address: 60
  width: 128
  height: 64
  radio_delay_ms: 500

PWM: 
  pwm_hz: 5000
  direction_pin: NO_PIN
  output_pin: gpio.2
  enable_pin: gpio.4
  disable_with_s0: false
  s0_with_disable: true
  spinup_ms: 0
  spindown_ms: 0
  tool_num: 100
  speed_map: 0=0.00% 10000=100.00%
  off_on_alarm: false

arc_tolerance_mm: 0.002000
junction_deviation_mm: 0.010000
verbose_errors: false
report_inches: false
enable_parking_override_control: false
use_line_numbers: false
planner_blocks: 16